[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextrole-agent"
version = "0.2.0"
description = "Autonomous job-search agent that handles the busywork and asks a human at real career decision points."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "strands-agents>=1.0.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
nextrole-web = "nextrole.webapp:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nextrole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
