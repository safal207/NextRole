[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextrole-agent"
version = "0.1.0"
description = "Autonomous job-search agent that handles the busywork and asks a human at real career decision points."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "strands-agents>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
